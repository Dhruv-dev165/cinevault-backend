<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Private Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen font-sans">

  <!-- Login Screen -->
  <div id="loginBox" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#151a24] border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <span class="bg-rose-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Admin Only</span>
        <h1 class="text-2xl font-extrabold mt-3 text-white">CineVault Control Panel</h1>
        <p class="text-gray-400 text-sm mt-1">Login to upload 480p, 720p & 1080p movie links</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Admin Password</label>
          <input type="password" id="adminPassInput" required placeholder="Enter admin password (default: admin123)"
            class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-rose-500" />
        </div>
        <p id="loginError" class="text-rose-400 text-sm hidden"></p>
        <button type="submit"
          class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-lg transition">
          Unlock Admin Panel
        </button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard (Hidden until logged in) -->
  <div id="dashboard" class="hidden max-w-6xl mx-auto p-4 md:p-8">
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-gray-800 mb-8">
      <div>
        <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
          CineVault Backend Admin
        </h1>
        <p class="text-gray-400 text-sm">Users only see the public frontend. Changes here go live immediately.</p>
      </div>
      <button onclick="logout()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg text-sm font-semibold">
        Logout
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Upload Form -->
      <div class="lg:col-span-7 bg-[#151a24] border border-gray-800 rounded-2xl p-6">
        <h2 class="text-lg font-bold text-white mb-4">Upload New Movie / Series Links</h2>
        <form id="uploadForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Movie Title *</label>
            <input type="text" id="title" required placeholder="e.g., Pushpa 2 (2024) Hindi Dubbed [480p, 720p, 1080p]"
              class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:border-rose-500 focus:outline-none" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Category</label>
              <select id="category" class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white">
                <option value="Bollywood">Bollywood</option>
                <option value="Hollywood">Hollywood</option>
                <option value="South Dubbed">South Dubbed</option>
                <option value="Web Series">Web Series</option>
                <option value="4K/1080p">4K/1080p</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Release Year</label>
              <input type="text" id="year" value="2026"
                class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Badge Tag</label>
              <input type="text" id="qualityTag" value="1080p WEB-DL"
                class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Language</label>
              <input type="text" id="language" value="Hindi / Dual Audio"
                class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">File Sizes Info</label>
              <input type="text" id="size" value="450MB / 980MB / 2.2GB"
                class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Poster Image URL</label>
            <input type="url" id="poster" placeholder="https://example.com/poster.jpg"
              class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:border-rose-500 focus:outline-none" />
          </div>

          <div class="bg-[#0b0e14] border border-gray-800 rounded-xl p-4 space-y-3">
            <p class="text-xs font-bold text-amber-400 uppercase tracking-wider">Direct Download Links (Paste URLs)</p>
            <div>
              <label class="block text-xs text-gray-400 mb-1">480p Download URL</label>
              <input type="url" id="link480" placeholder="https://..."
                class="w-full bg-[#151a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">720p Download URL</label>
              <input type="url" id="link720" placeholder="https://..."
                class="w-full bg-[#151a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">1080p Download URL</label>
              <input type="url" id="link1080" placeholder="https://..."
                class="w-full bg-[#151a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Storyline / Synopsis</label>
            <textarea id="synopsis" rows="2" placeholder="Short description of the movie..."
              class="w-full bg-[#0b0e14] border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-white"></textarea>
          </div>

          <button type="submit"
            class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-lg transition shadow-lg">
            + Publish Movie to User Frontend
          </button>
        </form>
      </div>

      <!-- Existing Movies Manager -->
      <div class="lg:col-span-5 bg-[#151a24] border border-gray-800 rounded-2xl p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-white">Published Movies (<span id="movieCount">0</span>)</h2>
          <button onclick="loadMovies()" class="text-xs text-rose-400 hover:underline">Refresh</button>
        </div>
        <div id="adminMovieList" class="space-y-3 max-h-[680px] overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('cinevault_admin_pass') || '';

    if (adminPassword) {
      verifyAndOpen(adminPassword);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassInput').value;
      await verifyAndOpen(pass);
    });

    async function verifyAndOpen(pass) {
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        if (res.ok) {
          adminPassword = pass;
          sessionStorage.setItem('cinevault_admin_pass', pass);
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadMovies();
        } else {
          errEl.textContent = 'Invalid Admin Password!';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.textContent = 'Server error. Make sure backend is running.';
        errEl.classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('cinevault_admin_pass');
      location.reload();
    }

    async function loadMovies() {
      const res = await fetch('/api/movies');
      const movies = await res.json();
      document.getElementById('movieCount').textContent = movies.length;
      const container = document.getElementById('adminMovieList');
      container.innerHTML = movies.map(m => `
        <div class="bg-[#0b0e14] border border-gray-800 rounded-xl p-3 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <img src="${m.poster}" class="w-12 h-16 object-cover rounded-md bg-gray-800 shrink-0" />
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">${m.title}</p>
              <p class="text-xs text-gray-400">${m.category} • ${m.year}</p>
              <div class="flex gap-1 mt-1">
                ${m.links['480p'] ? '<span class="text-[10px] bg-emerald-900/50 text-emerald-400 px-1.5 py-0.5 rounded">480p</span>' : ''}
                ${m.links['720p'] ? '<span class="text-[10px] bg-amber-900/50 text-amber-400 px-1.5 py-0.5 rounded">720p</span>' : ''}
                ${m.links['1080p'] ? '<span class="text-[10px] bg-rose-900/50 text-rose-400 px-1.5 py-0.5 rounded">1080p</span>' : ''}
              </div>
            </div>
          </div>
          <button onclick="deleteMovie('${m.id}')"
            class="bg-rose-950 hover:bg-rose-600 text-rose-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold shrink-0 transition">
            Delete
          </button>
        </div>
      `).join('');
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        year: document.getElementById('year').value,
        qualityTag: document.getElementById('qualityTag').value,
        language: document.getElementById('language').value,
        size: document.getElementById('size').value,
        poster: document.getElementById('poster').value,
        synopsis: document.getElementById('synopsis').value,
        links: {
          '480p': document.getElementById('link480').value,
          '720p': document.getElementById('link720').value,
          '1080p': document.getElementById('link1080').value
        }
      };

      const res = await fetch('/api/movies', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Movie published! It is now visible on the User Frontend.');
        document.getElementById('uploadForm').reset();
        loadMovies();
      } else {
        const data = await res.json();
        alert('Error: ' + (data.error || 'Failed to upload'));
      }
    });

    async function deleteMovie(id) {
      if (!confirm('Delete this movie from the website?')) return;
      const res = await fetch('/api/movies/' + id, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.ok) loadMovies();
    }
  </script>
</body>
</html>
